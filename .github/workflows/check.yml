name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mindbug-lab
      - uses: actions/checkout@v4
        with:
          repository: YuuinIH/turn-kernel
          ref: 4979c0a19ae817a31a94eb38e59ff1d5189348fc
          path: turn-kernel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run check
        working-directory: turn-kernel
      - run: npm ci --ignore-scripts && npm run check && npm run demo && npm run demo:pet
        working-directory: mindbug-lab
