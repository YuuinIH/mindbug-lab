name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: mindbug-lab
      - uses: actions/checkout@v4
        with:
          repository: YuuinIH/turn-kernel
          ref: ecaf7809c9d48d9a9606e0190e0859668f106d66
          path: turn-kernel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts && npm run check
        working-directory: turn-kernel
      - run: npm ci --ignore-scripts && npm run check && npm run demo && npm run demo:pet && npm run demo:strike
        working-directory: mindbug-lab
